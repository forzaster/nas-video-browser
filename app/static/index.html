<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b0e">
<title>Family Videos</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="/static/app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <span class="eyebrow">YOUR HOME VIDEO LIBRARY</span>
        <h1>Family Videos</h1>
      </div>
    </div>
    <section class="toolbar" aria-label="機器設定">
      <label class="field"><span class="field-label">MediaServer <span id="server-spinner" class="spinner" hidden title="取得中"></span></span>
        <select id="server"><option value="">選択してください</option></select></label>
      <label class="field"><span class="field-label">再生先</span>
        <select id="renderer"><option value="">ブラウザ（MP4）</option></select></label>
      <div class="toolbar-actions">
        <button id="discover" class="btn primary" type="button">機器を検索</button>
        <button id="crawl" class="btn" type="button">再クロール</button>
        <details class="add-device">
          <summary class="btn ghost">機器URLを指定</summary>
          <form id="add" class="popover">
            <label class="field"><span class="field-label">機器説明URL（description.xml）</span>
              <input id="location" type="url" required placeholder="http://…/description.xml" aria-label="機器説明URL"></label>
            <button class="btn primary">登録</button>
          </form>
        </details>
      </div>
    </section>
  </div>
</header>

<div class="shell">
  <section class="intro">
    <p class="tagline">思い出を、年とアルバムから。</p>
    <p id="crawl-status" class="status-pill" role="status"></p>
  </section>

  <form id="login" class="login-card" hidden>
    <span class="login-icon" aria-hidden="true"></span>
    <h2>ログインが必要です</h2>
    <p>ライブラリを開くにはアクセストークンを入力してください。</p>
    <label class="field"><span class="field-label">アクセストークン</span>
      <input id="token" type="password" required autocomplete="current-password"></label>
    <button class="btn primary">ログイン</button>
  </form>

  <p id="message" class="notice" role="status"></p>

  <nav id="breadcrumbs" class="crumbs" aria-label="階層"></nav>
  <main id="content">
    <div class="empty"><span class="empty-icon" aria-hidden="true"></span>
      <p class="empty-title">ライブラリを準備しましょう</p>
      <p>MediaServerを選択すると、クローラーが動画を取得します。</p></div>
  </main>
</div>

<section id="player" class="dock" aria-label="プレーヤー">
  <div class="dock-inner">
    <video id="video" controls hidden></video>
    <div class="now-wrap">
      <span class="now-art" aria-hidden="true"></span>
      <div class="now-text"><span class="eyebrow">NOW PLAYING</span>
        <strong id="now">動画を選択してください</strong></div>
    </div>
    <div class="controls">
      <div class="transport">
        <button id="play" class="btn primary icon-play" type="button">再生</button>
        <button id="pause" class="btn icon-pause" type="button">一時停止</button>
        <button id="stop" class="btn icon-stop" type="button">停止</button>
      </div>
      <label class="switch"><input id="repeat" type="checkbox" checked><span class="switch-track" aria-hidden="true"></span><span class="switch-label">最後まで再生したら繰り返す（開始時に適用）</span></label>
    </div>
  </div>
</section>

<dialog id="edit">
  <form id="title-form">
    <h2>タイトルを編集</h2>
    <p id="original" class="dialog-original"></p>
    <input id="title" maxlength="300" aria-label="新しいタイトル">
    <p class="dialog-hint">空欄で保存すると元のタイトルに戻ります。</p>
    <div class="dialog-actions">
      <button type="button" id="cancel" class="btn ghost">キャンセル</button>
      <button class="btn primary">保存</button>
    </div>
  </form>
</dialog>
</body>
</html>
